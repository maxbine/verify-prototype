<?xml version="1.0" encoding="UTF-8"?>
<!-- Sella logo specimen — all variants + brand specs on one page. -->
<!-- Open in Illustrator, Figma, Affinity, or Inkscape. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1680" width="1200" height="1680" role="img" aria-label="Sella logo specimen">
  <defs>
    <style>
      .canvas { fill: #F2EFEC; }
      .ink { fill: #2D2942; }
      .subtle { fill: #8A8893; }
      .micro { fill: #BEBDC4; }
      .panel-light { fill: #FFFFFF; stroke: #DDDDE1; stroke-width: 1; }
      .panel-dark { fill: #2D2942; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1.6px; fill: #8A8893; }
      .h { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 22px; fill: #2D2942; letter-spacing: -0.4px; }
      .body { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 13px; fill: #58566A; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 500; font-size: 12px; fill: #2D2942; }
      .swatch-name { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 12px; fill: #2D2942; }
      .swatch-hex { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 400; font-size: 11px; fill: #8A8893; }
      .divider { stroke: #DDDDE1; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="1680" class="canvas"/>

  <!-- Header -->
  <g transform="translate(64, 64)">
    <text class="label">SELLA HEALTH · LOGO SPECIMEN</text>
    <text y="48" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="40" letter-spacing="-1" fill="#2D2942">Brand identity</text>
    <text y="78" class="body">All variants of the Sella mark, wordmark, and lockup. Colors and font specifications below.</text>
  </g>

  <line x1="64" y1="184" x2="1136" y2="184" class="divider"/>

  <!-- ====================== SECTION 1: PRIMARY LOCKUP ====================== -->
  <g transform="translate(64, 224)">
    <text class="label">01 · PRIMARY LOCKUP</text>
    <text y="32" class="h">Mark + wordmark</text>
    <text y="60" class="body">The default mark for any application that has horizontal room. Bottom dot baseline-aligns to the wordmark.</text>
  </g>

  <!-- Lockup, drawn at 2× scale (720 wide x 256 tall) -->
  <g transform="translate(240, 360)">
    <circle cx="48" cy="64"  r="16" fill="#E96424" opacity="0.22"/>
    <circle cx="48" cy="124" r="24" fill="#E96424" opacity="0.50"/>
    <circle cx="48" cy="196" r="40" fill="#E96424" opacity="1"/>
    <text x="128" y="220" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="168" letter-spacing="-6" fill="#2D2942">sella</text>
  </g>

  <line x1="64" y1="640" x2="1136" y2="640" class="divider"/>

  <!-- ====================== SECTION 2: MARK VARIANTS ====================== -->
  <g transform="translate(64, 680)">
    <text class="label">02 · MARK</text>
    <text y="32" class="h">Three colorways</text>
    <text y="60" class="body">Use the standalone mark when there isn't room for the full lockup, or as an avatar / app icon. Each variant ships in /logo as a separate SVG.</text>
  </g>

  <!-- Mark · color (warm canvas behind for context) -->
  <g transform="translate(64, 800)">
    <rect width="320" height="256" rx="16" class="panel-light"/>
    <g transform="translate(128, 64)">
      <circle cx="32" cy="14" r="6"  fill="#E96424" opacity="0.22"/>
      <circle cx="32" cy="44" r="9"  fill="#E96424" opacity="0.50"/>
      <circle cx="32" cy="80" r="15" fill="#E96424" opacity="1"/>
    </g>
    <text x="20" y="232" class="mono">mark.svg</text>
    <text x="20" y="248" class="body">Color, on light surfaces</text>
  </g>

  <!-- Mark · mono dark -->
  <g transform="translate(440, 800)">
    <rect width="320" height="256" rx="16" class="panel-light"/>
    <g transform="translate(128, 64)">
      <circle cx="32" cy="14" r="6"  fill="#2D2942" opacity="0.22"/>
      <circle cx="32" cy="44" r="9"  fill="#2D2942" opacity="0.50"/>
      <circle cx="32" cy="80" r="15" fill="#2D2942" opacity="1"/>
    </g>
    <text x="20" y="232" class="mono">mark-mono-dark.svg</text>
    <text x="20" y="248" class="body">Single-color, on light surfaces</text>
  </g>

  <!-- Mark · mono light, on dark -->
  <g transform="translate(816, 800)">
    <rect width="320" height="256" rx="16" class="panel-dark"/>
    <g transform="translate(128, 64)">
      <circle cx="32" cy="14" r="6"  fill="#F2EFEC" opacity="0.30"/>
      <circle cx="32" cy="44" r="9"  fill="#F2EFEC" opacity="0.60"/>
      <circle cx="32" cy="80" r="15" fill="#F2EFEC" opacity="1"/>
    </g>
    <text x="20" y="232" class="mono" fill="#F2EFEC">mark-mono-light.svg</text>
    <text x="20" y="248" class="body" fill="#BEBDC4">Single-color, on dark surfaces</text>
  </g>

  <line x1="64" y1="1104" x2="1136" y2="1104" class="divider"/>

  <!-- ====================== SECTION 3: BRAND COLORS ====================== -->
  <g transform="translate(64, 1144)">
    <text class="label">03 · COLOR</text>
    <text y="32" class="h">Brand palette</text>
    <text y="60" class="body">Orange is the brand. Cool ink is the body. Warm canvas is the surface. Don't introduce new hues without a brand-system conversation.</text>
  </g>

  <!-- Swatches -->
  <g transform="translate(64, 1264)">
    <!-- Primary orange -->
    <rect width="200" height="120" rx="14" fill="#E96424"/>
    <text x="0" y="148" class="swatch-name">Brand orange</text>
    <text x="0" y="166" class="swatch-hex">#E96424</text>
    <text x="0" y="182" class="swatch-hex">RGB 233 100 36</text>
  </g>
  <g transform="translate(296, 1264)">
    <rect width="200" height="120" rx="14" fill="#2D2942"/>
    <text x="0" y="148" class="swatch-name">Cool ink (text)</text>
    <text x="0" y="166" class="swatch-hex">#2D2942</text>
    <text x="0" y="182" class="swatch-hex">RGB 45 41 66</text>
  </g>
  <g transform="translate(528, 1264)">
    <rect width="200" height="120" rx="14" fill="#F2EFEC" stroke="#DDDDE1" stroke-width="1"/>
    <text x="0" y="148" class="swatch-name">Warm canvas (bg)</text>
    <text x="0" y="166" class="swatch-hex">#F2EFEC</text>
    <text x="0" y="182" class="swatch-hex">RGB 242 239 236</text>
  </g>
  <g transform="translate(760, 1264)">
    <rect width="200" height="120" rx="14" fill="#FFFFFF" stroke="#DDDDE1" stroke-width="1"/>
    <text x="0" y="148" class="swatch-name">Surface white</text>
    <text x="0" y="166" class="swatch-hex">#FFFFFF</text>
    <text x="0" y="182" class="swatch-hex">For cards, sheets</text>
  </g>

  <line x1="64" y1="1480" x2="1136" y2="1480" class="divider"/>

  <!-- ====================== SECTION 4: TYPE & USAGE ====================== -->
  <g transform="translate(64, 1520)">
    <text class="label">04 · TYPE</text>
    <text y="32" class="h">Inter</text>
    <text y="64" class="body"><tspan x="0" dy="0">Wordmark uses Inter weight 600 (SemiBold),</tspan><tspan x="0" dy="18">letter-spacing -0.036em.</tspan></text>
    <text y="118" class="body"><tspan x="0" dy="0">Free download:</tspan><tspan x="0" dy="18" fill="#2D2942">rsms.me/inter</tspan></text>

    <text x="544" y="0" class="label">USAGE NOTES</text>
    <text x="544" y="32" class="body"><tspan x="544" dy="0">· Clear-space: 1× bottom-dot diameter on every side</tspan><tspan x="544" dy="22">· Minimum mark size: 16px tall (use favicon.svg below 32px)</tspan><tspan x="544" dy="22">· Don't recolor the mark outside the brand palette</tspan><tspan x="544" dy="22">· Don't outline, drop-shadow, or distort the dots</tspan><tspan x="544" dy="22">· Don't separate the dots — they read as one mark</tspan></text>
  </g>
</svg>
