<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" aria-label="System error card mockup — explicitly not a coverage decision">
  <defs>
    <style>
      .card-bg { fill: #F0F0F2; }
      .card-stroke { stroke: #BEBDC4; stroke-width: 1; stroke-dasharray: 6 4; fill: none; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 1.5px; fill: #58566A; }
      .h { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 21px; fill: #2D2942; letter-spacing: -0.4px; }
      .body { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 14px; fill: #58566A; }
      .disclaimer { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #2D2942; letter-spacing: -0.1px; }
      .btn-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #2D2942; }
    </style>
  </defs>

  <!-- Card with dashed border to flag "not a normal result" -->
  <rect x="0.5" y="0.5" width="359" height="439" rx="20" ry="20" class="card-bg"/>
  <rect x="6" y="6" width="348" height="428" rx="16" ry="16" class="card-stroke"/>

  <!-- System status label (no colored dot — cool-400 instead) -->
  <g transform="translate(28, 36)">
    <g transform="translate(0, 0)">
      <!-- A simple offline / unreachable glyph: hollow circle with a slash -->
      <circle cx="6" cy="6" r="5" fill="none" stroke="#58566A" stroke-width="1.5"/>
      <line x1="2.5" y1="9.5" x2="9.5" y2="2.5" stroke="#58566A" stroke-width="1.5"/>
    </g>
    <text x="22" y="10" class="label">PAYER UNREACHABLE</text>
  </g>

  <!-- Headline -->
  <g transform="translate(28, 80)">
    <text class="h">
      <tspan x="0" dy="0">We couldn't reach the</tspan>
      <tspan x="0" dy="28">payer right now</tspan>
    </text>
  </g>

  <!-- Disclaimer line — the explicit "not a coverage decision" -->
  <g transform="translate(28, 168)">
    <text class="disclaimer">This is not a coverage decision.</text>
  </g>

  <!-- Body explanation -->
  <g transform="translate(28, 200)">
    <text class="body">
      <tspan x="0" dy="0">The payer's eligibility service didn't respond.</tspan>
      <tspan x="0" dy="20">Try again, switch payer, or check your</tspan>
      <tspan x="0" dy="20">connection.</tspan>
    </text>
  </g>

  <!-- Action button -->
  <g transform="translate(28, 332)">
    <rect x="0" y="0" width="304" height="48" rx="12" ry="12" fill="#FFFFFF" stroke="#DDDDE1" stroke-width="1"/>
    <text x="152" y="30" text-anchor="middle" class="btn-text">Try again</text>
  </g>

  <!-- Soft secondary action -->
  <g transform="translate(28, 396)">
    <text class="body" style="fill: #8A8893;">Switch payer · Save for later</text>
  </g>
</svg>
