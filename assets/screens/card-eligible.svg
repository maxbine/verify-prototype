<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" aria-label="Eligible result card mockup">
  <defs>
    <style>
      .card-bg { fill: #FFFFFF; }
      .card-stroke { stroke: #DDDDE1; stroke-width: 1; fill: none; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 1.5px; fill: #2E9667; }
      .h { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 21px; fill: #2D2942; letter-spacing: -0.4px; }
      .row-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 12px; fill: #8A8893; letter-spacing: 0.3px; }
      .row-value { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 14px; fill: #2D2942; }
      .raw-link { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 12px; fill: #58566A; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="359" height="439" rx="20" ry="20" class="card-bg"/>
  <rect x="0.5" y="0.5" width="359" height="439" rx="20" ry="20" class="card-stroke"/>

  <!-- Status badge -->
  <g transform="translate(28, 36)">
    <circle cx="6" cy="6" r="5" fill="#2E9667"/>
    <text x="22" y="10" class="label">ELIGIBLE</text>
  </g>

  <!-- Headline statement, with the orange answer-dot as the period -->
  <g transform="translate(28, 80)">
    <text class="h">
      <tspan x="0" dy="0">Margaret Johnson is</tspan>
      <tspan x="0" dy="28">eligible for home</tspan>
      <tspan x="0" dy="28">health services</tspan>
    </text>
    <circle cx="200" cy="70" r="5" fill="#E96424"/>
  </g>

  <!-- Divider -->
  <line x1="28" y1="206" x2="332" y2="206" stroke="#DDDDE1" stroke-width="1"/>

  <!-- Fact rows -->
  <g transform="translate(28, 232)">
    <text class="row-label">COVERAGE PERIOD</text>
    <text y="22" class="row-value">Jan 1, 2026 — Dec 31, 2026</text>
  </g>
  <g transform="translate(28, 290)">
    <text class="row-label">PLAN</text>
    <text y="22" class="row-value">Original Medicare Part A &amp; B</text>
  </g>
  <g transform="translate(28, 348)">
    <text class="row-label">COST SHARE</text>
    <text y="22" class="row-value">$0 deductible met</text>
  </g>

  <!-- Detail link -->
  <g transform="translate(28, 410)">
    <text class="raw-link">View raw 271 response →</text>
  </g>
</svg>
