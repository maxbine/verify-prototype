<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept 2 — Concept/metaphor: 'sella' is Latin for saddle; a soft cradle-curve sits above the wordmark — quietly supportive, restrained, distinctly ours. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Sella saddle arc lockup">
  <!-- the cradle / saddle arc -->
  <path d="M 80 110 C 80 210 240 210 240 110"
        fill="none"
        stroke="#2D2942"
        stroke-width="10"
        stroke-linecap="round"/>
  <!-- wordmark -->
  <text x="160" y="252"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="64"
        font-weight="600"
        fill="#2D2942"
        letter-spacing="-2.5">sella</text>
  <!-- terminator dot -->
  <circle cx="244" cy="234" r="6" fill="#E96424"/>
</svg>
