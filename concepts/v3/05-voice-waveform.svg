<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept v3-5 — Voice waveform: five bars echoing the audio waveform of the liaison's most-used tool (the phone call), with the loudest bar in primary-500 — the moment the answer arrives. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Sella voice waveform mark">
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#F2EFEC"/>
  <g>
    <rect x="64" y="116" width="14" height="24" rx="3" fill="#2D2942"/>
    <rect x="92" y="92" width="14" height="72" rx="3" fill="#2D2942"/>
    <rect x="120" y="76" width="14" height="104" rx="3" fill="#E96424"/>
    <rect x="148" y="100" width="14" height="56" rx="3" fill="#2D2942"/>
    <rect x="176" y="120" width="14" height="16" rx="3" fill="#2D2942"/>
  </g>
</svg>
