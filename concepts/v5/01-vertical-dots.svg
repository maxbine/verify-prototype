<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept v5-1 (iterated) — Vertical dots mark, airier wordmark: Outfit Medium 500 (geometric sans), positive tracking, lighter weight; balances the saturated bottom dot without competing with it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Sella vertical dots mark">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap');
  </style>
  <circle cx="60" cy="60" r="10" fill="#FCDCC8"/>
  <circle cx="60" cy="100" r="14" fill="#F4B58D"/>
  <circle cx="60" cy="148" r="20" fill="#E96424"/>
  <text x="108" y="168"
        font-family="'Outfit', 'DM Sans', 'Avenir Next', 'Avenir', 'Futura', sans-serif"
        font-size="80"
        font-weight="500"
        fill="#2D2942"
        letter-spacing="0.5">sella</text>
</svg>
