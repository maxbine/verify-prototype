<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept 3 — Abstract symbol: a single brand-orange dot above a calm horizon line — the verdict above the data, speed-to-decision distilled to two marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Sella horizon-dot mark">
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#FBFAF9"/>
  <line x1="64" y1="160" x2="192" y2="160"
        stroke="#BEBDC4"
        stroke-width="3"
        stroke-linecap="round"/>
  <circle cx="128" cy="118" r="11" fill="#E96424"/>
</svg>
