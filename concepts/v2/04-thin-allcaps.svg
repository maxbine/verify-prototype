<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept v2-4 — Thin all-caps with brand bar: 'SELLA' set ultra-thin and wide-tracked under a heavy primary-500 bar — institutional, precise, the wordmark's deliberate counterpoint to v2-1. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Sella thin all-caps wordmark">
  <rect x="180" y="74" width="240" height="6" fill="#E96424"/>
  <text x="300" y="138"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="48"
        font-weight="200"
        fill="#2D2942"
        letter-spacing="22">SELLA</text>
</svg>
