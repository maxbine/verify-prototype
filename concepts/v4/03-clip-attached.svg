  <path d="M 220 20 L 340 20 L 324 84 L 236 84 Z" fill="#2D2942"/>
  <rect x="40" y="116" width="480" height="64" fill="#E96424" transform="rotate(-3 280 148)"/>
  <text x="280" y="180"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="116"
        font-weight="900"
        fill="#2D2942"
        letter-spacing="-5">sella</text>
</svg>
