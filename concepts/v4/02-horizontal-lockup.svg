<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept v4-2 — Horizontal lockup: clip on the left, highlighted wordmark on the right; orange lives in the highlighter sweep, not a dot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Sella horizontal lockup — clip beside highlighted wordmark">
  <path d="M 56 56 L 152 56 L 140 124 L 68 124 Z" fill="#2D2942"/>
  <rect x="180" y="78" width="430" height="68" fill="#E96424" transform="rotate(-3 395 112)"/>
  <text x="200" y="142"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="108"
        font-weight="900"
        fill="#2D2942"
        letter-spacing="-5">sella</text>
</svg>
